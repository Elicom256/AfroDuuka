# ---------------------------------------------------------------------------
#  Production web — one nginx that serves the SPA and routes the API
# ---------------------------------------------------------------------------
#  This used to be two containers: this static file server plus a separate
#  reverse proxy in front of it that routed /api and /storage to Laravel. The
#  proxy added a hop and a second nginx to keep in sync for no benefit, so its
#  routing lives here now.
#
#  TLS is NOT terminated here. This server block listens on :80 only. Terminate
#  TLS at a load balancer or host in front of this container and forward to :80.
#  Publishing :443 without an ssl_certificate just accepts connections and drops
#  them. To terminate here, mount the cert/key and add a `listen 443 ssl` block
#  repeating the locations below.
# ---------------------------------------------------------------------------

# Docker's embedded DNS, re-queried at request time.
#
# An `upstream` block resolves its server name once, at startup, and then holds
# that IP forever. When a container is recreated it usually comes back on a
# different address, and nginx keeps dialling the old one, so every request to
# that upstream fails with "Connection refused" until nginx is restarted. On a
# deploy that replaces the backend container, that is the whole API returning 502
# while the static frontend keeps serving.
#
# Putting the host in a variable makes proxy_pass skip the startup resolution and
# consult this resolver per request instead. The cost is that the URI has to be
# passed explicitly and there is no upstream keepalive pool.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PHP's post_max_size in this image is 8M. nginx defaults to 1M and would
    # reject larger request bodies with a bare 413 before Laravel ever runs, so
    # product-image uploads would fail with no application-level error.
    client_max_body_size 8m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # =========================== API ==============================
    # `^~` so a request like /api/foo.js is proxied, not captured by the asset
    # regex below.
    location ^~ /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /storage/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================= Frontend ===============================
    # SPA fallback: any path that is not a real file resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif|map)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }
}
