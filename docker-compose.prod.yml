# ---------------------------------------------------------------------------
#  Production stack
# ---------------------------------------------------------------------------
#  Bring the whole thing up with:
#
#      docker compose -f docker-compose.prod.yml up -d --build
#
#  This file is self-contained (it does not require docker-compose.yml as a
#  base). It previously was not valid at all: the backend service had no image
#  or build context, and pgsql/redis were absent, so `docker compose config`
#  failed outright and nothing could be launched from it.
#
#  Before first run: put real production values in ./api/.env, in particular
#  APP_KEY, DB_PASSWORD and the WhatsApp credentials. APP_KEY and the database
#  password must not be the development ones.
# ---------------------------------------------------------------------------

services:
  # ============================ Front end ==============================
  # Serves the built bundle from its own nginx on 8080. Only the proxy
  # publishes a port; the frontend is reachable on the internal network only.
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    expose:
      - '8080'
    env_file:
      - ./ui/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/']
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================ Backend ===============================
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    expose:
      - '8000'
    env_file:
      - ./api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  # ========================== Queue worker ============================
  # The dev stack has this and the production stack did not. Without it every
  # queued job is silently dropped, which means no WhatsApp notifications, no
  # subscription lifecycle processing and no session/SES suppression handling
  # in production.
  queue-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ./api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The backend service owns migrations; running them here too would race.
      SKIP_MIGRATIONS: "true"
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

    # The image bakes in a HEALTHCHECK that probes 127.0.0.1:8000/up, but
    # queue:work never binds :8000. Disable it so the container is not
    # permanently marked unhealthy.
    healthcheck:
      disable: true

  # ============================ Postgres ==============================
  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventory}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in ./api/.env}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-inventory}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================== Redis ===============================
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================== Proxy ===============================
  proxy:
    image: nginx:alpine
    ports:
      # Only :80. nginx.prod.conf has no ssl_certificate and no `listen 443 ssl`
      # block, so publishing :443 would accept connections and serve nothing.
      # Terminate TLS in front of this container; see proxy/nginx.prod.conf.
      - '80:80'
    volumes:
      - ./proxy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgsql-data:
  redis-data:

networks:
  app:
    driver: bridge
