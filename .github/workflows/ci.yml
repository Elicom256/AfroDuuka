name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: elicom
          POSTGRES_PASSWORD: elicom256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elicom -d inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, pgsql, mbstring, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Resolve the PostgreSQL service hostname
        run: echo "127.0.0.1 pgsql" | sudo tee -a /etc/hosts

      - name: Mount frontend sources for API route drift check
        run: sudo ln -s "$GITHUB_WORKSPACE/ui" /frontend

      - name: Run Pint (code style)
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: Run PHPUnit
        working-directory: api
        run: ./vendor/bin/phpunit

      - name: Composer audit
        working-directory: api
        run: composer audit --no-interaction --no-dev || true

      - name: Generate OpenAPI spec
        working-directory: api
        env:
          APP_KEY: base64:gFxa/k+ls+63RNaQjIDQh0/5VXuCTzF0zaIHf+yG+ns=
          DB_CONNECTION: pgsql
          DB_HOST: pgsql
          DB_PORT: 5432
          DB_DATABASE: inventory_test
          DB_USERNAME: elicom
          DB_PASSWORD: elicom256
          DB_URL: ""
        run: |
          php artisan migrate --force
          php artisan scramble:export

      - name: Check OpenAPI spec is up to date
        working-directory: api
        run: git diff --exit-code -- storage/api-docs/api-docs.json

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run ESLint
        working-directory: ui
        run: npm run lint

      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=critical || true

      - name: TypeScript build
        working-directory: ui
        run: npm run build

      - name: Run frontend tests
        working-directory: ui
        run: npm test
