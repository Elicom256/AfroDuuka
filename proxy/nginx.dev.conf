# ---------------------------------------------------------------------------
#  Development nginx
# ---------------------------------------------------------------------------
# Add this mapping block at the very top of your file
map $http_upgrade $connection_upgrade{
    default upgrade;
    ''      close;
}

# Docker's embedded DNS, re-queried at request time.
#
# An `upstream` block resolves its server name once, at startup, and then holds
# that IP forever. When a container is recreated it usually comes back on a
# different address, and nginx keeps dialling the old one — every request to that
# upstream fails with "Connection refused" until nginx itself is restarted. That
# is not a dev-only annoyance: it is the same failure a production deploy gets
# the first time the backend container is replaced.
#
# Putting the host in a variable makes proxy_pass skip the startup resolution and
# consult this resolver per request instead. The cost is that the URI has to be
# passed explicitly, and there is no upstream keepalive pool.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================== API ==============================
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /storage/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================= Frontend ===============================
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream$request_uri;

        proxy_http_version 1.1;

        # Added: WebSocket support for Vite Hot Module Replacement (HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
