# ---------------------------------------------------------------------------
#  Production nginx (edge)
# ---------------------------------------------------------------------------
#  Serves the built SPA from the frontend container and proxies /api to Laravel.
#
#  Upstreams must match the ports the containers actually listen on. The
#  frontend image serves the static bundle with its own nginx on 8080
#  (ui/nginx.conf); 5173 is the Vite dev server and only exists in
#  docker-compose.dev.yml. Pointing this at 5173 leaves production with no
#  frontend at all, which is what it used to do.
#
#  TLS is NOT terminated here. This server block listens on :80 only, and
#  docker-compose.prod.yml publishes only :80 to match. Terminate TLS at a load
#  balancer or host in front of this container and forward to :80. Publishing
#  :443 without a ssl_certificate just accepts connections and drops them, which
#  reads as "HTTPS is up" while every request fails. If you would rather
#  terminate TLS here, mount the cert and key and add a `listen 443 ssl`
#  server block that repeats the three locations below.
# ---------------------------------------------------------------------------

# Docker's embedded DNS, re-queried at request time.
#
# An `upstream` block resolves its server name once, at startup, and then holds
# that IP forever. When a container is recreated it usually comes back on a
# different address, and nginx keeps dialling the old one, so every request to
# that upstream fails with "Connection refused" until nginx is restarted. On a
# deploy that replaces the backend container, that is the whole API returning 502
# while the static frontend keeps serving.
#
# Putting the host in a variable makes proxy_pass skip the startup resolution and
# consult this resolver per request instead. The cost is that the URI has to be
# passed explicitly and there is no upstream keepalive pool.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # PHP's post_max_size in this image is 8M. nginx defaults to 1M and would
    # reject larger request bodies with a bare 413 before Laravel ever runs, so
    # product-image uploads would fail with no application-level error.
    client_max_body_size 8m;

    # Security headers. These were present in nginx.dev.conf and absent here,
    # which meant production was less protected than development.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # =========================== API ==============================
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /storage/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================= Frontend ===============================
    # No Upgrade/Connection headers: those exist for Vite's HMR websocket, and
    # the production frontend is a static file server with no websocket to
    # upgrade to. Sending "Connection: upgrade" on every asset request is wrong
    # and was copied over from nginx.dev.conf.
    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream$request_uri;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
