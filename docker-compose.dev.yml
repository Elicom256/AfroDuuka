# ------------------------------------------------------------------------
#   Development container (All-In-One Setup)
# ------------------------------------------------------------------------

services:
  # =========================== Front end service ======================
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    image: inventory-frontend-dev
    working_dir: /app
    env_file:
      - ./ui/.env
    volumes:
      - ./ui:/app
      # The bind mount above shadows /app entirely, so dependencies live in a
      # named volume instead. Docker seeds it from the node_modules installed by
      # `npm ci` in Dockerfile.dev on first use, which is why no install runs at
      # container start. Recreate it after changing package.json.
      - ui-node-modules:/app/node_modules
    # ports:
    #   - '5173:5173'
    # The dev command comes from the image (npm run dev -- --host 0.0.0.0).
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

    # ======================== Backend service ============================
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    image: inventory-backend-dev
    working_dir: /app
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      # Mount the entrypoint so edits apply without rebuilding the image.
      - ./api/docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  # ---------------------------------------------
  #  Queue worker (replaces the old schedule:queue:work anti-pattern)
  # ---------------------------------------------
  queue-worker:
    image: inventory-backend-dev
    working_dir: /app
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      # Mount the entrypoint so edits apply without rebuilding the image.
      - ./api/docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    environment:
      # The backend service owns migrations; running them here too would race.
      SKIP_MIGRATIONS: "true"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
    # The image bakes in a HEALTHCHECK that probes 127.0.0.1:8000/up, but
    # queue:work never binds :8000. Disable it so the container is not
    # permanently marked unhealthy.
    healthcheck:
      disable: true

  #  ---------------------------------------------------------------
  #  Postgres service
  #  ---------------------------------------------------------------
  pgsql:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventory}
      POSTGRES_USER: ${DB_USERNAME:-elicom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elicom256}
    env_file:
      - ./api/.env
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-elicom} -d ${DB_DATABASE:-inventory}'] # Adjusted to default username
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Redis Service
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================== Nginx dev proxy =========================
  proxy:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./proxy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app

volumes:
  pgsql-data:
  redis-data:
  # Frontend dependencies, installed by `npm ci` in ui/Dockerfile.dev.
  ui-node-modules:

networks:
  app:
    driver: bridge
